<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>提醒</title>
<style>
  :root{
    --canvas:#FFFFFF; --ink:#22252A; --ink2:#6B6F76; --line:#E7E4DD;
    --a:#2C7BCB; --aSoft:#EAF2FB; --chrome:#F7F6F2;
  }
  body.dark{
    --canvas:#1B1D20; --ink:#EDEEF0; --ink2:#9AA0A7; --line:#2C2F34;
    --a:#5B9BE0; --aSoft:#1F2A35; --chrome:#232629;
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  .card{
    margin:6px;box-sizing:border-box;height:calc(100vh - 12px);
    background:var(--canvas);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 14px 40px rgba(20,24,30,.22);
    padding:18px 20px 16px;display:flex;flex-direction:column;
  }
  .eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--a);font-weight:600;text-transform:uppercase}
  .title{font-size:19px;font-weight:600;color:var(--ink);margin-top:7px;line-height:1.32}
  .body{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5;flex:1}
  .acts{display:flex;gap:10px;margin-top:12px}
  button{
    flex:1;height:38px;border-radius:10px;font-size:13.5px;cursor:pointer;
    font-family:inherit;border:1px solid transparent;transition:background .12s,border-color .12s
  }
  button.p{background:var(--a);color:#fff;font-weight:600}
  button.p:hover{filter:brightness(1.06)}
  button.g{background:transparent;color:var(--ink2);border-color:var(--line)}
  button.g:hover{background:var(--chrome)}
  .hint{font-size:11px;color:var(--ink2);margin-top:9px;opacity:.75;text-align:right}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="title" id="title"></div>
    <div class="body" id="body"></div>
    <div class="acts">
      <button class="g" id="secondary"></button>
      <button class="p" id="primary"></button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let payload = null;

  function render(d) {
    payload = d || {};
    document.body.classList.toggle('dark', payload.theme === 'dark');
    $('eyebrow').textContent = payload.eyebrow || '';
    $('title').textContent = payload.title || '';
    $('body').textContent = payload.body || '';
    $('primary').textContent = payload.primaryLabel || 'OK';
    $('secondary').textContent = payload.secondaryLabel || '';
    $('hint').textContent = payload.hint || '';
  }

  window.promptApi.onData(render);

  $('primary').onclick = () => window.promptApi.act('primary');
  $('secondary').onclick = () => window.promptApi.act('secondary');
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.promptApi.act('dismiss');
    if (e.key === 'Enter') window.promptApi.act('primary');
  });
</script>
</body>
</html>
